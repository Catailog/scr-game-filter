name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Hash
        run: |
          $hash = (Get-FileHash build/Release/scr-game-filter.exe -Algorithm SHA256).Hash
          "SHA256: $hash" | Out-File -Encoding ascii notes.txt
          Get-Content notes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: scr-game-filter
          path: build/Release/scr-game-filter.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME build/Release/scr-game-filter.exe --title $env:GITHUB_REF_NAME --notes-file notes.txt
